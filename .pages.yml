# Pages CMS configuration (app.pagescms.org) — v3.1
# This file defines everything editors can see and change.
# It must stay in sync with src/content.config.ts (the build-time validation).

media:
  - name: images
    label: Images
    input: src/assets/uploads
    output: ../../assets/uploads
    extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
  - name: documents
    label: Documents
    input: public/files
    output: /files
    extensions: [pdf, doc, docx]

content:
  - name: homepage
    label: Home
    description: The text on the home page — hero, section headings and the venue call-out.
    type: file
    path: src/content/homepage/home.yml
    fields:
      - name: heroTitle
        label: Main heading
        type: string
        required: true
      - name: heroIntro
        label: Welcome paragraph
        type: text
        required: true
      - { name: heroButtonEvents, label: 'Button: events', type: string }
      - { name: heroButtonBelieve, label: 'Button: what we believe', type: string }
      - { name: eventsHeading, label: Events section heading, type: string }
      - name: eventsEmptyText
        label: Text when no upcoming events
        type: text
      - { name: announcementsHeading, label: Announcements section heading, type: string }
      - name: announcementsEmptyText
        label: Text when no announcements
        type: text
      - { name: venueHeading, label: Venue call-out heading, type: string }
      - { name: venueText, label: Venue call-out text, type: text }
      - { name: venueButton, label: Venue call-out button, type: string }

  - name: believe
    label: What We Believe
    type: file
    path: src/content/pages/what-we-believe.md
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: intro
        label: Introduction
        type: text
        required: true
      - name: heroImage
        label: Banner photo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
      - name: heroImageAlt
        label: Banner photo description
        type: string
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.heading}'
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: text
            label: Text
            type: rich-text
            required: true
          - name: image
            label: Photo (optional)
            type: image
            options:
              extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
          - name: imageAlt
            label: Photo description
            type: string
          - name: imageCaption
            label: Photo caption (optional)
            description: A small light line shown under the photo.
            type: string
          - name: imageStyle
            label: Photo style
            description: 'Photo: framed and cropped to shape. Emblem: shown smaller, uncropped, no frame — for logos and symbols.'
            type: select
            default: photo
            options:
              values:
                - { value: photo, label: Photo }
                - { value: emblem, label: Emblem }
          - name: imageSide
            label: Photo position (desktop)
            description: Which side of the text the photo sits on for desktop screens. On phones it always stacks below the text.
            type: select
            default: right
            options:
              values:
                - { value: right, label: Right }
                - { value: left, label: Left }

  - name: do
    label: What We Do
    type: file
    path: src/content/pages/what-we-do.md
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: intro
        label: Introduction
        type: text
        required: true
      - name: heroImage
        label: Banner photo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
      - name: heroImageAlt
        label: Banner photo description
        type: string
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.heading}'
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: text
            label: Text
            type: rich-text
            required: true
          - name: image
            label: Photo (optional)
            type: image
            options:
              extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
          - name: imageAlt
            label: Photo description
            type: string
          - name: imageCaption
            label: Photo caption (optional)
            description: A small light line shown under the photo.
            type: string
          - name: imageStyle
            label: Photo style
            description: 'Photo: framed and cropped to shape. Emblem: shown smaller, uncropped, no frame — for logos and symbols.'
            type: select
            default: photo
            options:
              values:
                - { value: photo, label: Photo }
                - { value: emblem, label: Emblem }
          - name: imageSide
            label: Photo position (desktop)
            description: Which side of the text the photo sits on for desktop screens. On phones it always stacks below the text.
            type: select
            default: right
            options:
              values:
                - { value: right, label: Right }
                - { value: left, label: Left }

  - name: centre
    label: Community Centre
    description: The Community Centre page — its text, photos and all venue-hire settings.
    type: file
    path: src/content/centre/centre.md
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: intro
        label: Introduction
        type: text
        required: true
      - name: heroImage
        label: Banner photo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
      - name: heroImageAlt
        label: Banner photo description
        type: string
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.heading}'
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: text
            label: Text
            type: rich-text
            required: true
          - name: image
            label: Photo (optional)
            type: image
            options:
              extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
          - name: imageAlt
            label: Photo description
            type: string
          - name: imageCaption
            label: Photo caption (optional)
            description: A small light line shown under the photo.
            type: string
          - name: imageStyle
            label: Photo style
            description: 'Photo: framed and cropped to shape. Emblem: shown smaller, uncropped, no frame — for logos and symbols.'
            type: select
            default: photo
            options:
              values:
                - { value: photo, label: Photo }
                - { value: emblem, label: Emblem }
          - name: imageSide
            label: Photo position (desktop)
            description: Which side of the text the photo sits on for desktop screens. On phones it always stacks below the text.
            type: select
            default: right
            options:
              values:
                - { value: right, label: Right }
                - { value: left, label: Left }
      - name: hireHeading
        label: Hire section heading
        type: string
      - name: hireCalendarNote
        label: Hire calendar explanation
        description: The paragraph under the hire heading explaining the availability calendar.
        type: text
      - name: hireIntro
        label: Hire form introduction
        type: text
        required: true
      - name: hirePolicyUrl
        label: Centre Hire Policy file
        description: The document "Please read our Centre Hire Policy" on the hire form links to. Upload a new PDF here to replace it.
        type: file
        options:
          media: documents
          extensions: [pdf]
      - name: hireRates
        label: Hire rates
        description: One rate per line, e.g. "$30 per hour". Shown under the availability calendar.
        type: string
        list: true

  - name: pages
    label: Pages
    description: Extra pages that are not in the menu. A page created here appears on the website at /its-file-name/ — link to it from other pages or share the address directly.
    type: collection
    path: src/content/extra-pages
    view:
      fields: [title]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: intro
        label: Introduction
        type: text
        required: true
      - name: heroImage
        label: Banner photo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
      - name: heroImageAlt
        label: Banner photo description
        type: string
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.heading}'
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: text
            label: Text
            type: rich-text
            required: true
          - name: image
            label: Photo (optional)
            type: image
            options:
              extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
          - name: imageAlt
            label: Photo description
            type: string
          - name: imageCaption
            label: Photo caption (optional)
            description: A small light line shown under the photo.
            type: string
          - name: imageStyle
            label: Photo style
            description: 'Photo: framed and cropped to shape. Emblem: shown smaller, uncropped, no frame — for logos and symbols.'
            type: select
            default: photo
            options:
              values:
                - { value: photo, label: Photo }
                - { value: emblem, label: Emblem }
          - name: imageSide
            label: Photo position (desktop)
            description: Which side of the text the photo sits on for desktop screens. On phones it always stacks below the text.
            type: select
            default: right
            options:
              values:
                - { value: right, label: Right }
                - { value: left, label: Left }

  - name: gallery
    label: Centre photo gallery
    description: Photos of the inside of the Community Centre, in display order — drag the handle on each row to reorder.
    type: file
    path: src/content/gallery/gallery.yml
    fields:
      - name: photos
        label: Photos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.caption}'
        fields:
          - name: image
            label: Photo
            type: image
            required: true
            options:
              extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
          - name: caption
            label: Caption
            description: Shown under the photo and read aloud by screen readers.
            type: string
            required: true

  - name: events
    label: Events
    description: Upcoming events shown on the home page. Past events drop off automatically.
    type: collection
    path: src/content/events
    view:
      fields: [title, start, location]
      sort: [start]
    fields:
      - name: title
        label: Event name
        type: string
        required: true
      - name: start
        label: Starts
        type: date
        required: true
        options: { time: true, format: "yyyy-MM-dd'T'HH:mm" }
      - name: end
        label: Ends
        type: date
        options: { time: true, format: "yyyy-MM-dd'T'HH:mm" }
      - name: location
        label: Location
        type: string
        required: true
      - name: image
        label: Photo
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
      - name: imageAlt
        label: Photo description
        description: Describe the photo for people using screen readers.
        type: string
      - name: body
        label: Description
        type: rich-text

  - name: announcements
    label: News
    description: News shown on the home page (newest first).
    type: collection
    path: src/content/announcements
    view:
      fields: [title, date]
      sort: [date]
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: expires
        label: Hide after (optional)
        description: The announcement disappears from the home page after this date.
        type: date
      - name: image
        label: Photo (optional)
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, gif, JPG, JPEG, PNG, WEBP, GIF]
      - name: imageAlt
        label: Photo description
        type: string
      - name: body
        label: Text
        type: rich-text

  - name: settings
    label: Site settings
    description: Contact details and site-wide text.
    type: file
    path: src/content/settings/site.yml
    fields:
      - { name: siteName, label: Site name, type: string, required: true }
      - name: tagline
        label: Site description
        description: Shown to search engines and in link previews — not on the page itself.
        type: string
        required: true
      - { name: contactEmail, label: Contact email, type: string, required: true }
      - name: bookingEmail
        label: Booking officer email
        description: Hire applications from the website are sent here.
        type: string
        required: true
      - { name: phone, label: Phone (optional), type: string }
      - { name: address, label: Address, type: string, required: true }
      - { name: facebook, label: Facebook page link (optional), type: string }
      - name: footer
        label: Footer
        type: object
        fields:
          - name: text
            label: Footer text
            description: The short paragraph under the site name in the footer.
            type: text
            required: true
          - name: acknowledgement
            label: Acknowledgement of Country
            type: text
            required: true
          - name: links
            label: Explore links
            description: The link list in the footer's Explore column.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.name}'
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: url
                label: Web address
                type: string
                required: true
      - name: sitePassword
        label: Pre-launch access code
        description: While this has a value, visitors must enter it to view the site. CLEAR THIS FIELD TO LAUNCH the site publicly.
        type: string
